services:
  document-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logipro-document-intelligence
    environment:
      LOGIPRO_ENVIRONMENT: ${LOGIPRO_ENVIRONMENT:-development}
      LOGIPRO_DATA_DIR: /app/data
      LOGIPRO_EMBEDDING_DEVICE: ${LOGIPRO_EMBEDDING_DEVICE:-cpu}
      LOGIPRO_LLM_MODE: ${LOGIPRO_LLM_MODE:-auto}
      LOGIPRO_OLLAMA_BASE_URL: ${LOGIPRO_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - "${HOST_DATA_DIR:-./data}:/app/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
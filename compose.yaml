services:
  document-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logipro-document-intelligence
    environment:
      LOGIPRO_ENVIRONMENT: development
      LOGIPRO_DATA_DIR: /app/data
      LOGIPRO_EMBEDDING_DEVICE: cpu
      LOGIPRO_LLM_MODE: auto
      LOGIPRO_OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped